name: Build Test Client (make)
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-26, ubuntu-24.04]
    name: Build Test Client (${{matrix.os}})
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - name: Build with make
        run: make -C OTDIPC-TestClient