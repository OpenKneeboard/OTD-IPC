name: Build Test Client (make)
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-26, ubuntu-24.04]
    name: Build Test Client (${{matrix.os}})
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4
      - name: Build with make
        shell: sh
        run: |
          if [ -x /usr/bin/g++-14 ]; then
            export CXX=/usr/bin/g++-14
          fi
          make -C OTDIPC-TestClient
